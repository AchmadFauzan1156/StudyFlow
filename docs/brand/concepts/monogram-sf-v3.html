<!doctype html><html lang="id"><head><meta charset="utf-8"><title>StudyFlow — monogram SF v3</title>
<style>
@font-face { font-family: PJS; src: url("../../../shared/src/commonMain/composeResources/font/plus_jakarta_sans_bold.ttf"); font-weight: 700; }
@font-face { font-family: PJS; src: url("../../../shared/src/commonMain/composeResources/font/plus_jakarta_sans_regular.ttf"); font-weight: 400; }
body { font-family: PJS, sans-serif; background: #FBFBF9; color: #1C1B19; margin: 0; padding: 32px 40px; width: 1300px; }
h1 { font-size: 28px; margin: 0 0 4px; } .lead { color: #57534E; margin: 0 0 24px; }
.row { display: flex; gap: 16px; align-items: flex-end; }
figure { margin: 0; text-align: center; font-size: 12px; color: #57534E; }
figure img { display: block; border-radius: 26px; }
.paper img { background: #FFFFFF; border: 1px solid #E4E2DD; } .night img { background: #121413; }
figcaption { margin-top: 6px; }
.smalls { display: flex; gap: 14px; align-items: flex-end; margin-left: 12px; }
.sm { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: #78736C; gap: 4px; }
.word { display: flex; align-items: center; gap: 12px; margin-top: 22px; }
.word span { font-weight: 700; font-size: 40px; letter-spacing: -0.5px; }
</style></head><body>
<h1>StudyFlow — monogram SF (v3)</h1>
<p class="lead">S: tiga baris agenda yang tersambung belokan bulat (atas digeser kanan, bawah digeser kiri). F: batang amber = garis warna mata kuliah.</p>
<div class="row">
  <figure><img src="SF-3-icon.svg" width="170"><figcaption>Ikon (persegi)</figcaption></figure>
  <figure><img src="SF-3-circle.svg" width="170" style="border-radius:50%"><figcaption>Masker bulat + zona aman</figcaption></figure>
  <figure class="paper"><img src="SF-3-color.svg" width="170"><figcaption>Warna</figcaption></figure>
  <figure class="paper"><img src="SF-3-mono.svg" width="170"><figcaption>Monokrom</figcaption></figure>
  <figure class="night"><img src="SF-3-dark.svg" width="170"><figcaption>Gelap</figcaption></figure>
  <div class="smalls"><div class="sm"><img src="SF-3-icon.svg" width="48" height="48"><span>48px</span></div><div class="sm"><img src="SF-3-icon.svg" width="32" height="32"><span>32px</span></div><div class="sm"><img src="SF-3-icon.svg" width="24" height="24"><span>24px</span></div><div class="sm"><img src="SF-3-icon.svg" width="16" height="16"><span>16px</span></div></div>
</div>
<div class="word"><img src="SF-3-color.svg" width="72"><span>StudyFlow</span></div>
</body></html>
