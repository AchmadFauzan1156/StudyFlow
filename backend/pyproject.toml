[project]
name = "studyflow-backend"
version = "0.1.0"
description = "StudyFlow API dan worker (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.141.1",
    "httpx2>=2.13.1",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.0",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

# FastAPI Cloud: `fastapi deploy` dari folder backend/ memakai entrypoint ini.
[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: membutuhkan PostgreSQL (STUDYFLOW_TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py312"
